<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
  <title>2048</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 600px;
      height: 600px;
      overflow: hidden;
      background: #000;
      font-family: 'Arial Black', Arial, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 15px;
    }

    /* ── Header ─────────────────────────────────────────── */
    .header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 50px;
      flex-shrink: 0;
    }

    .title {
      font-size: 40px;
      font-weight: 900;
      color: #ffd700;
      letter-spacing: 3px;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
    }

    .scores {
      display: flex;
      gap: 8px;
    }

    .score-box {
      background: #0d0d0d;
      border: 1px solid #1e1e1e;
      border-radius: 8px;
      padding: 4px 12px;
      text-align: center;
      min-width: 72px;
    }

    .score-label {
      font-size: 10px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-family: Arial, sans-serif;
      font-weight: normal;
    }

    .score-value {
      font-size: 20px;
      font-weight: bold;
      color: #ffd700;
    }

    /* ── Grid ───────────────────────────────────────────── */
    .grid-wrapper {
      width: 530px;
      height: 530px;
      background: #0a0a0a;
      border-radius: 12px;
      padding: 10px;
      flex-shrink: 0;
      border: 1px solid #1a1a1a;
    }

    /* 4 × 120px cells + 3 × 10px gaps = 510px */
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 120px);
      grid-template-rows: repeat(4, 120px);
      gap: 10px;
    }

    .cell {
      width: 120px;
      height: 120px;
      background: #111;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 36px;
      transition: background 0.08s ease, color 0.08s ease;
    }

    /* ── Tile colours — optimised for additive waveguide ── */
    /* Dark backgrounds disappear; bright text glows in air */
    .t2    { background: #0d2a45; color: #7ecff0; font-size: 36px; }
    .t4    { background: #0d3320; color: #5af2a0; font-size: 36px; }
    .t8    { background: #3d1a00; color: #ff9a1f;
              font-size: 36px; text-shadow: 0 0 12px rgba(255,154,31,.7); }
    .t16   { background: #3d1000; color: #ff5e3a;
              font-size: 32px; text-shadow: 0 0 12px rgba(255,94,58,.7); }
    .t32   { background: #3d2e00; color: #ffe033;
              font-size: 32px; text-shadow: 0 0 12px rgba(255,224,51,.7); }
    .t64   { background: #1a0050; color: #b87eff;
              font-size: 32px; text-shadow: 0 0 14px rgba(184,126,255,.7); }
    .t128  { background: #40002e; color: #ff7ed4;
              font-size: 26px; text-shadow: 0 0 16px rgba(255,126,212,.8); }
    .t256  { background: #003535; color: #00f5d4;
              font-size: 26px; text-shadow: 0 0 16px rgba(0,245,212,.8); }
    .t512  { background: #353500; color: #e8ff40;
              font-size: 26px; text-shadow: 0 0 16px rgba(232,255,64,.8); }
    .t1024 { background: #003520; color: #40ffb8;
              font-size: 22px; text-shadow: 0 0 20px rgba(64,255,184,.9); }
    .t2048 { background: #352800; color: #ffd700; font-size: 22px;
              text-shadow: 0 0 24px #ffd700, 0 0 48px rgba(255,215,0,.6);
              box-shadow: inset 0 0 20px rgba(255,215,0,.15); }
    .t-hi  { background: #220040; color: #e040fb; font-size: 18px;
              text-shadow: 0 0 24px #e040fb, 0 0 48px rgba(224,64,251,.6);
              box-shadow: inset 0 0 20px rgba(224,64,251,.15); }

    /* tile-appear keyframe */
    @keyframes pop {
      0%   { transform: scale(0.5); opacity: 0.4; }
      60%  { transform: scale(1.08); }
      100% { transform: scale(1);   opacity: 1; }
    }
    .cell.new { animation: pop 0.18s ease-out forwards; }

    /* ── Overlays ───────────────────────────────────────── */
    .overlay {
      position: fixed;
      inset: 0;
      width: 600px;
      height: 600px;
      background: rgba(0, 0, 0, 0.90);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      z-index: 30;
    }
    .overlay.hidden { display: none; }

    .overlay-title {
      font-size: 46px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .overlay-sub {
      font-size: 20px;
      color: #777;
      font-family: Arial, sans-serif;
      font-weight: normal;
    }

    .btn {
      background: #ffd700;
      color: #000;
      border: none;
      border-radius: 10px;
      padding: 14px 40px;
      font-size: 20px;
      font-weight: bold;
      font-family: Arial, sans-serif;
      cursor: pointer;
      outline: none;
      min-width: 170px;
      transition: opacity 0.1s;
    }

    .btn-alt {
      background: #1a1a1a;
      color: #aaa;
    }

    .btn:focus {
      outline: 3px solid #00d4ff;
      outline-offset: 3px;
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
    }

    /* hint at bottom */
    .hint {
      position: fixed;
      bottom: 8px;
      left: 0; right: 0;
      text-align: center;
      font-size: 11px;
      color: #2a2a2a;
      font-family: Arial, sans-serif;
      font-weight: normal;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="title">2048</div>
    <div class="scores">
      <div class="score-box">
        <div class="score-label">Score</div>
        <div class="score-value" id="score">0</div>
      </div>
      <div class="score-box">
        <div class="score-label">Best</div>
        <div class="score-value" id="best">0</div>
      </div>
    </div>
  </div>

  <div class="grid-wrapper">
    <div class="grid" id="grid"></div>
  </div>

  <div class="hint">swipe to move &nbsp;·&nbsp; middle pinch for menu</div>

  <!-- ── Game Over overlay ─────────────────────────────── -->
  <div class="overlay hidden" id="overlayOver">
    <div class="overlay-title" style="color:#ff5e3a;text-shadow:0 0 24px rgba(255,94,58,.6)">
      Game Over
    </div>
    <div class="overlay-sub">No more moves!</div>
    <button class="btn" id="btnRestart">New Game</button>
  </div>

  <!-- ── Win overlay ───────────────────────────────────── -->
  <div class="overlay hidden" id="overlayWin">
    <div class="overlay-title" style="color:#ffd700;text-shadow:0 0 24px rgba(255,215,0,.7)">
      You Win!
    </div>
    <div class="overlay-sub">You reached 2048!</div>
    <button class="btn" id="btnContinue">Keep Playing</button>
    <button class="btn btn-alt" id="btnNewGame">New Game</button>
  </div>

  <script>
    var SIZE = 4;
    var board, score, bestScore, gameOver, keepPlaying, newCells;

    bestScore = parseInt(localStorage.getItem('2048mrbd-best') || '0', 10);

    // ── Core game logic ──────────────────────────────────

    function init() {
      board = [];
      for (var r = 0; r < SIZE; r++) {
        board[r] = [];
        for (var c = 0; c < SIZE; c++) board[r][c] = 0;
      }
      score = 0;
      gameOver = false;
      keepPlaying = false;
      newCells = [];
      addTile();
      addTile();
      render();
      hide('overlayOver');
      hide('overlayWin');
    }

    function addTile() {
      var empties = [];
      for (var r = 0; r < SIZE; r++)
        for (var c = 0; c < SIZE; c++)
          if (!board[r][c]) empties.push([r, c]);
      if (!empties.length) return;
      var pos = empties[Math.random() * empties.length | 0];
      board[pos[0]][pos[1]] = Math.random() < 0.9 ? 2 : 4;
      newCells.push(pos[0] * SIZE + pos[1]);
    }

    // Slide an array of length SIZE toward index 0, merging equal adjacent values.
    function slide(row) {
      var a = row.filter(Boolean), out = [];
      for (var i = 0; i < a.length; i++) {
        if (a[i] === a[i + 1]) {
          var v = a[i] * 2;
          out.push(v);
          score += v;
          i++;
        } else {
          out.push(a[i]);
        }
      }
      while (out.length < SIZE) out.push(0);
      return out;
    }

    function doMove(dir) {
      if (gameOver) return false;

      // Snapshot for change detection
      var snap = board.map(function(r) { return r.slice(); });
      var snapScore = score;
      var next = board.map(function(r) { return r.slice(); });

      if (dir === 'left' || dir === 'right') {
        for (var r = 0; r < SIZE; r++) {
          var row = board[r].slice();
          if (dir === 'right') row.reverse();
          row = slide(row);
          if (dir === 'right') row.reverse();
          next[r] = row;
        }
      } else {
        // up / down — operate on columns
        for (var c = 0; c < SIZE; c++) {
          var col = [];
          for (var r = 0; r < SIZE; r++) col.push(board[r][c]);
          if (dir === 'down') col.reverse();
          col = slide(col);
          if (dir === 'down') col.reverse();
          for (var r = 0; r < SIZE; r++) next[r][c] = col[r];
        }
      }

      // Detect if anything actually moved
      var moved = false;
      outer: for (var r = 0; r < SIZE; r++)
        for (var c = 0; c < SIZE; c++)
          if (next[r][c] !== snap[r][c]) { moved = true; break outer; }

      if (!moved) { score = snapScore; return false; }

      board = next;
      newCells = [];
      addTile();
      return true;
    }

    function hasValue(v) {
      for (var r = 0; r < SIZE; r++)
        for (var c = 0; c < SIZE; c++)
          if (board[r][c] === v) return true;
      return false;
    }

    function canMove() {
      for (var r = 0; r < SIZE; r++)
        for (var c = 0; c < SIZE; c++) {
          if (!board[r][c]) return true;
          if (c + 1 < SIZE && board[r][c] === board[r][c + 1]) return true;
          if (r + 1 < SIZE && board[r][c] === board[r + 1][c]) return true;
        }
      return false;
    }

    // ── Render ───────────────────────────────────────────

    function tileClass(v) {
      if (!v) return '';
      if (v <= 2048) return 't' + v;
      return 't-hi';
    }

    function render() {
      document.getElementById('score').textContent = score;
      document.getElementById('best').textContent = bestScore;

      var g = document.getElementById('grid');
      g.innerHTML = '';

      for (var r = 0; r < SIZE; r++) {
        for (var c = 0; c < SIZE; c++) {
          var v = board[r][c];
          var el = document.createElement('div');
          var idx = r * SIZE + c;
          el.className = 'cell' + (v ? ' ' + tileClass(v) : '');
          if (newCells.indexOf(idx) !== -1) el.classList.add('new');
          if (v) el.textContent = v;
          g.appendChild(el);
        }
      }
    }

    // ── Input ────────────────────────────────────────────

    var DIR_MAP = {
      ArrowLeft: 'left', ArrowRight: 'right',
      ArrowUp:   'up',   ArrowDown:  'down'
    };

    document.addEventListener('keydown', function(e) {
      // If an overlay is visible, let focussed buttons handle Enter naturally
      if (!document.getElementById('overlayOver').classList.contains('hidden') ||
          !document.getElementById('overlayWin').classList.contains('hidden')) return;

      var dir = DIR_MAP[e.key];
      if (!dir) return;
      e.preventDefault();

      if (doMove(dir)) {
        if (score > bestScore) {
          bestScore = score;
          localStorage.setItem('2048mrbd-best', bestScore);
        }
        render();
        if (!keepPlaying && hasValue(2048)) {
          show('overlayWin');
          focusEl('btnContinue');
          return;
        }
        if (!canMove()) {
          gameOver = true;
          show('overlayOver');
          focusEl('btnRestart');
        }
      }
    });

    // ── Overlay helpers ───────────────────────────────────

    function show(id) { document.getElementById(id).classList.remove('hidden'); }
    function hide(id) { document.getElementById(id).classList.add('hidden'); }
    function focusEl(id) { setTimeout(function() { document.getElementById(id).focus(); }, 60); }

    document.getElementById('btnRestart').addEventListener('click', init);
    document.getElementById('btnContinue').addEventListener('click', function() {
      keepPlaying = true;
      hide('overlayWin');
    });
    document.getElementById('btnNewGame').addEventListener('click', init);

    // ── Start ─────────────────────────────────────────────
    init();
  </script>
</body>
</html>
